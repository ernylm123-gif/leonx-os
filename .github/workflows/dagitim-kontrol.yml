# LEONX OS — Vercel dağıtım sağlık kontrolü
#
# Vercel her dağıtımı bitirdiğinde GitHub'a "deployment_status" gönderir; bu iş o dağıtımı kontrol eder:
#  • VERCEL_AUTOMATION_BYPASS_SECRET tanımlıysa dağıtımın KENDİ adresi (yayın öncesi / önizleme)
#    test edilir. Vercel → Settings → Deployment Checks'te bu kontrol ("Dağıtım sağlık kontrolü")
#    zorunlu seçilirse, başarısız dağıtım production alan adına hiç alınmaz.
#  • Production dağıtımında ayrıca kanonik adres, yayındaki commit bu dağıtımınki olana kadar
#    beklenip kontrol edilir; başarısızsa alarm issue'su açılır ve geri alma adımları yazılır.
# Yalnız okur; Supabase'e, verilere ve oturumlara dokunmaz.
name: Dağıtım kontrolü

on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    name: Dağıtım sağlık kontrolü
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENV_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      SHA: ${{ github.event.deployment.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/izleme
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dağıtım adresi (yayın öncesi)
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET yok: korumalı dağıtım adresi test edilemez (docs/URETIM_IZLEME.md)."
            exit 0
          fi
          node scripts/izleme/saglik.mjs --origin "$ENV_URL" --expect-commit "$SHA" --no-http --attempts 2
      - name: Kanonik adres (production yayını sonrası)
        id: kanonik
        if: startsWith(github.event.deployment.environment, 'Production')
        run: |
          # Alan adı yeni dağıtıma geçene kadar bekle (en fazla 10 dk)
          for i in $(seq 1 40); do
            C=$(curl -fsS --max-time 10 "https://leonx-os.vercel.app/version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit)}catch{}})") || true
            case "$SHA" in "$C"*) [ -n "$C" ] && break;; esac
            sleep 15
          done
          node scripts/izleme/saglik.mjs --expect-commit "$SHA" --out sonuc.json
      - name: Alarm
        if: failure() && steps.kanonik.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uretim-alarm --color B60205 --description "Production erişim alarmı (otomatik)" 2>/dev/null || true
          RAPOR=$(node -e "try{console.log(require('./sonuc.json').rapor)}catch{console.log('Sonuç dosyası üretilemedi.')}")
          BODY=$(printf 'Yeni production dağıtımı (%s) sağlık kontrolünden geçmedi.\n\n%s\n\n**Geri alma:** Actions → "Production geri alma" → Run workflow (veya Vercel panosu → Deployments → önceki sürüm → Instant Rollback). Supabase verisi ve oturumlar etkilenmez. Ayrıntı: docs/URETIM_IZLEME.md\n\nÖlçüm: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "${SHA:0:7}" "$RAPOR" "$RUN_URL")
          gh issue create --label uretim-alarm --title "Dağıtım alarmı: ${SHA:0:7} sağlık kontrolünden geçmedi" --body "$BODY"
