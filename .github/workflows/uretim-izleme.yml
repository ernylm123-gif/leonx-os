# LEONX OS — production erişim izleme (kullanıcının cihazlarından bağımsız)
#
# 10 dakikada bir GitHub'ın sunucularından: TLS/sertifika süresi, HTTP→HTTPS ve yönlendirme zinciri
# (döngü, HTTP'ye düşme, başka alana kaçış), güvenlik başlıkları, karışık içerik, uygulama paketleri,
# version.json, service worker ve manifest kontrol edilir; saatte bir Türkiye'deki ağlardan ölçüm
# eklenir. Sorun 3 denemede de sürerse "uretim-alarm" etiketli bir GitHub issue açılır (depo sahibine
# GitHub e-posta/mobil bildirimi gider); düzelince issue kendiliğinden kapanır. Yalnız okur.
name: Production izleme

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uretim-izleme
  cancel-in-progress: false

jobs:
  izle:
    name: HTTPS, yönlendirme ve PWA dosyaları
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/izleme
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sağlık kontrolü
        id: saglik
        continue-on-error: true
        run: |
          TR=""
          # Türkiye ölçümü saatte bir (ücretsiz Globalping kotasını korumak için)
          if [ "$(date -u +%M)" -lt 10 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TR="--tr-probes"; fi
          node scripts/izleme/saglik.mjs --out sonuc.json $TR
      - name: Alarm aç / güncelle / kapat
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SONUC: ${{ steps.saglik.outcome }}
        run: |
          gh label create uretim-alarm --color B60205 --description "Production erişim alarmı (otomatik)" 2>/dev/null || true
          OPEN=$(gh issue list --label uretim-alarm --state open --json number --jq '.[0].number')
          if [ "$SONUC" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "✅ Production yeniden sağlıklı. Kapatılıyor. Ölçüm: $RUN_URL"
              gh issue close "$OPEN"
            fi
            exit 0
          fi
          RAPOR=$(node -e "try{console.log(require('./sonuc.json').rapor)}catch{console.log('Sonuç dosyası üretilemedi; iş günlüğüne bakın.')}")
          BODY=$(printf '%s\n\n%s\n\nGeri alma: docs/URETIM_IZLEME.md → "Geri alma". Ölçüm: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "Production sağlık kontrolü 3 denemede de başarısız." "$RAPOR" "$RUN_URL")
          if [ -n "$OPEN" ]; then
            # Aynı alarm için yalnız saatte bir yorum (bildirim yağmuru olmasın)
            if [ "$(date -u +%M)" -lt 10 ]; then gh issue comment "$OPEN" --body "$BODY"; fi
          else
            gh issue create --label uretim-alarm --title "Production alarmı: leonx-os.vercel.app sağlık kontrolü başarısız" --body "$BODY"
          fi
          exit 1
